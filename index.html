<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الحضور والغياب الذكي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#16a34a', 600: '#15803d', 700: '#15803d', 800: '#166534', 900: '#14532d' },
                        slateCustom: { 800: '#1e293b', 900: '#0f172a' }
                    },
                    fontFamily: {
                        sans: ['Tajawal', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Tajawal Font -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center text-white shadow-md font-bold text-xl">
                    <i class="fa-solid me-0.5 fa-qrcode"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl tracking-tight text-white flex items-center gap-2">
                        حَاضِر <span class="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full">الذكي</span>
                    </h1>
                    <p class="text-xs text-slate-400 hidden sm:block">نظام إدارة وتسجيل الحضور بالتحقق الجغرافي</p>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center space-x-2 space-x-reverse">
                <div id="sessionBadge" class="hidden flex items-center gap-2 bg-emerald-950/80 border border-emerald-500/30 text-emerald-300 px-3 py-1.5 rounded-lg text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span>جلسة نشطة: <strong id="activeLectureBadgeName" class="text-white">--</strong></span>
                </div>

                <button id="navModeBtn" onclick="toggleViewMode()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs sm:text-sm px-3 py-2 rounded-lg border border-slate-700 flex items-center gap-2 transition">
                    <i class="fa-solid fa-mobile-screen-button text-emerald-400"></i>
                    <span id="navModeText">معاينة واجهة الطالب</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Notification Toast Box Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- Main Content Wrapper -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <!-- VIEW 1: ADMIN LOGIN VIEW -->
        <section id="adminLoginSection" class="max-w-md mx-auto my-12 animate-fade-in">
            <div class="glass-card rounded-2xl p-8 shadow-xl">
                <div class="text-center mb-6">
                    <div class="w-16 h-16 bg-slate-900 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900">دخول المحاضر / الأدمن</h2>
                    <p class="text-slate-500 text-xs mt-1">قم بتسجيل الدخول لبدء محاضرة جديدة ومتابعة الطلاب</p>
                </div>

                <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label>
                        <div class="relative">
                            <input type="password" id="adminLoginPassword" required placeholder="••••••••" 
                                class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-sm transition">
                            <i class="fa-solid fa-lock absolute left-3 top-3.5 text-slate-400 text-xs"></i>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-1">كلمة المرور الافتراضية للتجربة: <code class="bg-slate-200 px-1 py-0.5 rounded text-slate-800 font-mono">123456</code></p>
                    </div>

                    <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2 text-sm">
                        <span>تسجيل الدخول</span>
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </form>
            </div>
        </section>

        <!-- VIEW 2: ADMIN DASHBOARD (Setup + Live Feed) -->
        <section id="adminDashboardSection" class="hidden space-y-6 animate-fade-in">
            <div id="lectureSetupCard" class="glass-card rounded-2xl p-6 shadow-md border border-slate-200">
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-200">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-slate-900 text-emerald-400 flex items-center justify-center font-bold">
                            <i class="fa-solid fa-sliders"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">تجهيز وبدء جلسة حضور جديدة</h2>
                            <p class="text-xs text-slate-500">حدد بيانات المحاضرة والنطاق الجغرافي قبل بدء الجلسة</p>
                        </div>
                    </div>
                </div>

                <form onsubmit="handleStartLectureSession(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">اسم المحاضرة / المادة *</label>
                        <input type="text" id="lectureNameInput" required placeholder="مثال: هندسة البرمجيات" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">اسم/رقم القاعة أو المدرج *</label>
                        <input type="text" id="roomNameInput" required placeholder="مثال: مدرج جـ" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">النطاق الجغرافي المسموح به *</label>
                        <select id="gpsRadiusInput" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                            <option value="15">15 متراً (قاعة صغيرة)</option>
                            <option value="30" selected>30 متراً (مدرج متوسط)</option>
                            <option value="50">50 متراً (مدرج كبير)</option>
                            <option value="100">100 متر (مبنى الكلية)</option>
                        </select>
                    </div>
                    <div class="md:col-span-2 lg:col-span-3 flex flex-col sm:flex-row gap-3 pt-2">
                        <button type="button" onclick="captureAdminLocation()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-location-dot"></i>
                            <span id="locationBtnText">التقاط موقع القاعة الحالي</span>
                        </button>
